<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soudal Österreich - Produktvergleich</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #d71920; margin-bottom: 25px; }
        p { text-align: left; font-weight: bold; margin-bottom: 5px; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background-color: #fff; cursor: pointer; }
        .result-card { border: 2px solid #d71920; padding: 20px; border-radius: 4px; display: none; background: #fff; text-align: left; margin-top: 20px; }
        .keyfacts { background: #f9f9f9; padding: 15px; border-radius: 4px; margin: 15px 0; white-space: pre-line; border-left: 4px solid #d71920; }
        .btn { display: block; background: #d71920; color: white; padding: 12px; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; margin-top: 10px; }
        .status { font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Soudal Produktvergleich</h2>
    
    <p>1. Wettbewerber wählen:</p>
    <select id="compSelect" onchange="updateProductDropdown()">
        <option value="">-- Bitte wählen --</option>
    </select>

    <p>2. Produkt wählen:</p>
    <select id="productSelect" onchange="showResult()" disabled>
        <option value="">-- Zuerst Wettbewerber wählen --</option>
    </select>
    
    <div id="result" class="result-card">
        <h3 id="soudalName" style="margin-top:0; color:#d71920;"></h3>
        <div id="keyfacts" class="keyfacts"></div>
        <a id="link" class="btn" href="#" target="_blank">Zum Produkt</a>
    </div>
    
    <div id="status" class="status">Verbindung zur Datenbank wird hergestellt...</div>
</div>

<script>
    // 1. Passwort-Schutz (UGB-Konformität für internen Gebrauch)
    const passwortAbfrage = prompt("Bitte Soudal-Passwort eingeben:");
    if (passwortAbfrage !== "Soudal2026") { 
        alert("Zugriff verweigert!");
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>Zugriff verweigert</h1>";
    }

    let database = [];
    // 2. Dein korrekter Google-CSV-Link
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNz0aKaUP6s9baivOaCAKKyMFTcQOQ22qGV1AQqX3k3zJOI2bcnlkV3HGDYU6QgPjz53P_X4LrL187/pub?output=csv';

    async function loadDatabase() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            const rows = data.split('\n').slice(1);
            
            database = rows.map(row => {
                // Trennung nach Komma oder Semikolon (robust für Excel-Exporte)
                const delimiter = row.includes(';') ? ';' : ',';
                const columns = row.split(new RegExp(`${delimiter}(?=(?:(?:[^"]*"){2})*[^"]*$)`));
                
                return {
                    compName: columns[0]?.replace(/"/g, '').trim(),
                    compProd: columns[1]?.replace(/"/g, '').trim(),
                    soudal: columns[2]?.replace(/"/g, '').trim(),
                    facts: columns[3]?.replace(/"/g, '').trim(),
                    link: columns[4]?.replace(/"/g, '').trim()
                };
            }).filter(p => p.compName && p.compName !== ""); 

            fillCompanyDropdown();
            document.getElementById('status').innerText = "Datenbank bereit (" + database.length + " Produkte geladen)";
        } catch (e) {
            document.getElementById('status').innerText = "Fehler: Datenbank konnte nicht geladen werden.";
            console.error(e);
        }
    }

    function fillCompanyDropdown() {
        const compSelect = document.getElementById('compSelect');
        const companies = [...new Set(database.map(p => p.compName))].sort();
        
        compSelect.innerHTML = '<option value="">-- Bitte wählen --</option>';
        companies.forEach(comp => {
            let opt = document.createElement('option');
            opt.value = comp;
            opt.innerHTML = comp;
            compSelect.appendChild(opt);
        });
    }

    function updateProductDropdown() {
        const compValue = document.getElementById('compSelect').value;
        const prodSelect = document.getElementById('productSelect');
        const resultDiv = document.getElementById('result');
        
        prodSelect.innerHTML = '<option value="">-- Produkt wählen --</option>';
        resultDiv.style.display = 'none';

        if (compValue) {
            const products = database.filter(p => p.compName === compValue).sort((a,b) => a.compProd.localeCompare(b.compProd));
            products.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.compProd;
                opt.innerHTML = p.compProd;
                prodSelect.appendChild(opt);
            });
            prodSelect.disabled = false;
        } else {
            prodSelect.disabled = true;
        }
    }

    function showResult() {
        const compValue = document.getElementById('compSelect').value;
        const prodValue = document.getElementById('productSelect').value;
        const resultDiv = document.getElementById('result');

        if (compValue && prodValue) {
            const match = database.find(p => p.compName === compValue && p.compProd === prodValue);
            if (match) {
                resultDiv.style.display = 'block';
                document.getElementById('soudalName').innerText = "Soudal Lösung: " + match.soudal;
                document.getElementById('keyfacts').innerText = match.facts;
                document.getElementById('link').href = match.link;
            }
        } else {
            resultDiv.style.display = 'none';
        }
    }

    loadDatabase();
</script>

</body>
</html>
