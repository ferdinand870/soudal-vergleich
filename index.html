<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soudal Österreich - Produktvergleich</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; text-align: center; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Korrigiertes Logo Branding */
        .logo-box { background-color: #d71920; color: white; font-family: 'Arial Black', sans-serif; font-size: 40px; padding: 10px 25px; display: inline-block; margin-bottom: 25px; border-radius: 2px; letter-spacing: -1px; }
        
        h2 { color: #d71920; margin-bottom: 30px; font-size: 24px; border-bottom: 2px solid #f4f4f4; padding-bottom: 15px; }
        p { text-align: left; font-weight: bold; margin-bottom: 8px; color: #555; }
        
        select { width: 100%; padding: 14px; margin-bottom: 25px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background-color: #fff; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,<svg%20xmlns%3D"http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg"%20width%3D"292.4"%20height%3D"292.4"><path%20fill%3D"%23333"%20d%3D"M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z"%2F><%2Fsvg>'); background-repeat: no-repeat; background-position: right%2015px%20top%2050%; background-size: 12px%20auto; }
        
        .result-card { border: 2px solid #d71920; padding: 25px; border-radius: 6px; display: none; background: #fff; text-align: left; margin-top: 25px; }
        .soudal-title { margin-top: 0; color: #d71920; text-align: center; font-size: 20px; }
        
        /* Produktbild: 90px */
        .prod-img { display: block; max-width: 90px; height: auto; margin: 20px auto; border-radius: 4px; }
        
        .keyfacts { background: #fdfdfd; padding: 18px; border-radius: 4px; margin: 20px 0; white-space: pre-line; border-left: 5px solid #d71920; line-height: 1.5; font-size: 15px; }
        
        .btn { display: block; background: #d71920; color: white; padding: 15px; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; }
        .status { font-size: 11px; color: #999; margin-top: 25px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">SOUDAL</div>
    
    <h2>Produktvergleich</h2>
    
    <p>1. Wettbewerber wählen:</p>
    <select id="compSelect" onchange="updateProductDropdown()">
        <option value="">-- Bitte wählen --</option>
    </select>

    <p>2. Produkt wählen:</p>
    <select id="productSelect" onchange="showResult()" disabled>
        <option value="">-- Zuerst Wettbewerber wählen --</option>
    </select>
    
    <div id="result" class="result-card">
        <h3 id="soudalName" class="soudal-title"></h3>
        <img id="productImage" class="prod-img" src="" alt="Soudal Produktbild" style="display:none;">
        <div id="keyfacts" class="keyfacts"></div>
        <a id="link" class="btn" href="#" target="_blank">Zum Produkt / Datenblatt</a>
    </div>
    
    <div id="status" class="status">Initialisiere Datenbank...</div>
</div>

<script>
    const passwortAbfrage = prompt("Bitte Soudal-Passwort eingeben:");
    if (passwortAbfrage !== "Soudal2026") { 
        alert("Zugriff verweigert!");
        document.body.innerHTML = "<h1 style='margin-top:100px; color:#d71920;'>Zugriff verweigert</h1>";
    }

    let database = [];
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNz0aKaUP6s9baivOaCAKKyMFTcQOQ22qGV1AQqX3k3zJOI2bcnlkV3HGDYU6QgPjz53P_X4LrL187/pub?output=csv';

    function parseCSVLine(line, delimiter) {
        const columns = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            let char = line[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === delimiter && !inQuotes) {
                columns.push(current.trim());
                current = '';
            } else current += char;
        }
        columns.push(current.trim());
        return columns.map(col => col.replace(/^"|"$/g, '').trim());
    }

    async function loadDatabase() {
        try {
            const response = await fetch(sheetUrl);
            const text = await response.text();
            const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
            const delimiter = rows[0].includes(';') ? ';' : ',';
            database = rows.slice(1).map(row => {
                const cols = parseCSVLine(row, delimiter);
                return {
                    compName: cols[0] || "",
                    compProd: cols[1] || "",
                    soudal: cols[2] || "",
                    facts: cols[3] || "",
                    link: cols[4] || "",
                    imgUrl: cols[5] || ""
                };
            }).filter(p => p.compName !== "");
            fillCompanyDropdown();
            document.getElementById('status').innerText = "Datenbank aktiv (" + database.length + " Produkte geladen)";
        } catch (e) {
            document.getElementById('status').innerText = "Systemfehler beim Laden der CSV-Daten.";
        }
    }

    function fillCompanyDropdown() {
        const compSelect = document.getElementById('compSelect');
        const companies = [...new Set(database.map(p => p.compName))].sort();
        compSelect.innerHTML = '<option value="">-- Bitte wählen --</option>';
        companies.forEach(comp => {
            let opt = document.createElement('option');
            opt.value = comp;
            opt.textContent = comp;
            compSelect.appendChild(opt);
        });
    }

    function updateProductDropdown() {
        const compValue = document.getElementById('compSelect').value;
        const prodSelect = document.getElementById('productSelect');
        const resultDiv = document.getElementById('result');
        prodSelect.innerHTML = '<option value="">-- Produkt wählen --</option>';
        resultDiv.style.display = 'none';
        if (compValue) {
            const products = database.filter(p => p.compName === compValue).sort((a,b) => a.compProd.localeCompare(b.compProd));
            products.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.compProd;
                opt.textContent = p.compProd;
                prodSelect.appendChild(opt);
            });
            prodSelect.disabled = false;
        } else prodSelect.disabled = true;
    }

    function showResult() {
        const compValue = document.getElementById('compSelect').value;
        const prodValue = document.getElementById('productSelect').value;
        const resultDiv = document.getElementById('result');
        const imgElement = document.getElementById('productImage');
        if (compValue && prodValue) {
            const match = database.find(p => p.compName === compValue && p.compProd === prodValue);
            if (match) {
                resultDiv.style.display = 'block';
                document.getElementById('soudalName').textContent = "Soudal Lösung: " + match.soudal;
                document.getElementById('keyfacts').textContent = match.facts;
                document.getElementById('link').href = match.link || "#";
                if (match.imgUrl && match.imgUrl.startsWith('http')) {
                    imgElement.src = match.imgUrl;
                    imgElement.style.display = 'block';
                } else imgElement.style.display = 'none';
            }
        } else resultDiv.style.display = 'none';
    }

    loadDatabase();
</script>
</body>
</html>
